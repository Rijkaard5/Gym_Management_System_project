<!-- ===== EQUIPMENT PAGE ===== -->
<div class="page" id="page-equipment">
  <div
    class="page-header flex justify-between items-center"
    style="display: flex !important"
  >
    <div>
      <h1>Equipment</h1>
      <p>Gym equipment inventory</p>
    </div>
    <button class="btn btn-primary" onclick="openModal('add-equipment')">
      + Add Equipment
    </button>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Brand</th>
            <th>Qty</th>
            <th>Condition</th>
            <th>Next Maintenance</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="equipment-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
