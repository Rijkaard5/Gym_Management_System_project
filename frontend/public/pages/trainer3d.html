<!-- ===== 3D TRAINER PAGE ===== -->
<div class="page" id="page-trainer3d">
  <div class="page-header">
    <h1>🤖 3D Virtual Trainer</h1>
    <p>Interactive AI-powered fitness coach</p>
  </div>
  <div class="grid grid-cols-2 gap-4">
    <div>
      <div id="trainer-canvas-wrap">
        <canvas id="trainer-canvas" width="500" height="500"></canvas>
        <div
          id="trainer-speech"
          style="
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--accent);
            border-radius: var(--r2);
            padding: 12px;
            font-size: 13px;
            color: var(--text);
            backdrop-filter: blur(8px);
            min-height: 48px;
          "
        ></div>
      </div>
      <div
        style="
          margin-top: 12px;
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 8px;
        "
      >
        <div class="trainer-stat">
          <div class="value" id="t-reps">0</div>
          <div class="label">Reps</div>
        </div>
        <div class="trainer-stat">
          <div class="value" id="t-sets">0</div>
          <div class="label">Sets</div>
        </div>
        <div class="trainer-stat">
          <div class="value" id="t-cal">0</div>
          <div class="label">Calories</div>
        </div>
      </div>
    </div>
    <div>
      <div class="card mb-4">
        <div class="card-header">
          <span class="card-title">Choose Exercise</span>
        </div>
        <div class="trainer-controls" id="exercise-buttons"></div>
      </div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">Session Controls</span>
        </div>
        <div class="flex gap-2 mb-3 flex-wrap">
          <button class="btn btn-primary" onclick="startSession()">
            ▶ Start
          </button>
          <button class="btn btn-secondary" onclick="pauseSession()">
            ⏸ Pause
          </button>
          <button class="btn btn-danger btn-sm" onclick="resetSession()">
            ↺ Reset
          </button>
        </div>
        <div>
          <label class="text-sm text-muted">Speed</label>
          <input
            type="range"
            min="0.3"
            max="3"
            step="0.1"
            value="1"
            oninput="setSpeed(this.value)"
            style="width: 100%; accent-color: var(--accent); margin-top: 4px"
          />
        </div>
        <div class="mt-3" id="muscle-targets"></div>
      </div>
    </div>
  </div>
</div>
