<!-- ===== DASHBOARD PAGE ===== -->
<div class="page active" id="page-dashboard">
  <div class="page-header">
    <h1>Dashboard</h1>
    <p id="dashboard-greeting">Welcome back!</p>
  </div>
  <div class="grid grid-cols-4 gap-4 mb-6" id="stat-cards"></div>
  <div class="grid grid-cols-2 gap-4 mb-6">
    <div class="card">
      <div class="card-header">
        <span class="card-title"> Revenue — Last 6 Months</span>
      </div>
      <div class="chart-container" id="revenue-chart"></div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title" style="display:flex;align-items:center;gap:6px;"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> Recent Members</span>
        <button class="btn btn-sm btn-secondary" onclick="navigate('members')">
          View All
        </button>
      </div>
      <div id="recent-members-list"></div>
    </div>
  </div>
  <div class="grid grid-cols-2 gap-4">
    <div class="card">
      <div class="card-header">
        <span class="card-title"> Equipment Status</span>
      </div>
      <div id="equipment-status-list"></div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title"> Upcoming Sessions</span>
      </div>
      <div id="upcoming-sessions-list"></div>
    </div>
  </div>
</div>
