<!-- ===== PAYMENTS PAGE ===== -->
<div class="page" id="page-payments">
  <div
    class="page-header flex justify-between items-center"
    style="display: flex !important"
  >
    <div>
      <h1>Payments</h1>
      <p>Revenue & transaction history</p>
    </div>
    <button class="btn btn-primary" onclick="openModal('add-payment')">
      + Record Payment
    </button>
  </div>
  <div class="grid grid-cols-3 gap-4 mb-6">
    <div class="stat-card">
      <div class="stat-icon" style="background: rgba(34, 197, 94, 0.15)"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
      <div class="stat-value text-green" id="total-rev">$0</div>
      <div class="stat-label">Total Revenue</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background: rgba(59, 130, 246, 0.15)"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
      <div class="stat-value text-blue" id="month-rev">$0</div>
      <div class="stat-label">This Month</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background: rgba(168, 85, 247, 0.15)"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></div>
      <div class="stat-value" id="total-txn">0</div>
      <div class="stat-label">Transactions</div>
    </div>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Receipt</th>
            <th>Member</th>
            <th>Plan</th>
            <th>Amount</th>
            <th>Method</th>
            <th>Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="payments-tbody"></tbody>
      </table>
    </div>
  </div>
</div>
