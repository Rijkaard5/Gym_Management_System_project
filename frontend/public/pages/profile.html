<!-- ===== PROFILE PAGE ===== -->
<div class="page" id="page-profile">
  <div class="page-header"><h1>Profile Settings</h1></div>
  <div class="grid grid-cols-2 gap-4">
    <div class="card">
      <div class="card-header">
        <span class="card-title" style="display:flex;align-items:center;gap:6px;"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Account Info</span>
      </div>
      <div id="profile-info"></div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="card-title" style="display:flex;align-items:center;gap:6px;"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Change Password</span>
      </div>
      <div class="form-group">
        <label>Current Password</label>
        <input
          class="form-control"
          id="cp-current"
          type="password"
          placeholder="Current password"
        />
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input
          class="form-control"
          id="cp-new"
          type="password"
          placeholder="New password"
        />
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input
          class="form-control"
          id="cp-confirm"
          type="password"
          placeholder="Confirm new password"
        />
      </div>
      <button class="btn btn-primary" onclick="changePassword()">
        Update Password
      </button>
    </div>
  </div>
</div>
