<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPro - Gym Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 420px;
        }
        
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            font-size: 2.5rem;
            color: #4CAF50;
            margin-bottom: 5px;
        }
        
        .logo p {
            color: #888;
            font-size: 1.1rem;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            color: #888;
            font-weight: 600;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            font-size: 1rem;
        }
        
        .tab.active {
            color: #4CAF50;
            border-bottom-color: #4CAF50;
        }
        
        .tab:hover {
            color: #4CAF50;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: #4CAF50;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.3);
        }
        
        .message {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        
        .message.error {
            background: #ffe6e6;
            color: #cc0000;
            display: block;
        }
        
        .message.success {
            background: #e6ffe6;
            color: #006600;
            display: block;
        }
        
        .info-box {
            background: #f0f8ff;
            border: 1px solid #b8daff;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #004085;
            line-height: 1.6;
        }
        
        .info-box strong {
            display: block;
            margin-bottom: 8px;
        }
        
        .info-box code {
            background: #e8f4ff;
            padding: 2px 6px;
            border-radius: 3px;
        }
        
        .hidden {
            display: none;
        }
        
        a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: 500;
        }
        
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo">
                <h1>🏋️ GymPro</h1>
                <p>Gym Management System</p>
            </div>
            
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" onclick="showTab('login')">🔐 Login</button>
                <button class="tab" onclick="showTab('register')">📝 Register</button>
            </div>
            
            <!-- Login Form -->
            <div id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" value="admin@gympro.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" value="admin123">
                </div>
                <button class="btn" onclick="handleLogin()">🔐 Login</button>
                <div id="loginMessage" class="message"></div>
            </div>
            
            <!-- Register Form -->
            <div id="registerForm" class="hidden">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="regName" placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" id="regEmail" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="regPassword" placeholder="Create a password">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="regPhone" placeholder="Enter your phone number">
                </div>
                <button class="btn" onclick="handleRegister()">📝 Register</button>
                <div id="registerMessage" class="message"></div>
            </div>
            
            <!-- Test Accounts Info -->
            <div class="info-box">
                <strong>📧 Demo Accounts (Password: admin123)</strong>
                <code>admin@gympro.com</code> - Admin<br>
                <code>trainer@gympro.com</code> - Trainer<br>
                <code>member@gympro.com</code> - Member
            </div>
        </div>
    </div>

   <script>
    const API_URL = 'http://localhost:3000/api';

    function showTab(tab) {
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const tabs = document.querySelectorAll('.tab');
        
        if (tab === 'login') {
            loginForm.classList.remove('hidden');
            registerForm.classList.add('hidden');
            tabs[0].classList.add('active');
            tabs[1].classList.remove('active');
        } else {
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            tabs[0].classList.remove('active');
            tabs[1].classList.add('active');
        }
        
        document.getElementById('loginMessage').className = 'message';
        document.getElementById('registerMessage').className = 'message';
    }

    async function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const msgDiv = document.getElementById('loginMessage');
        
        msgDiv.className = 'message';
        
        if (!email || !password) {
            msgDiv.className = 'message error';
            msgDiv.textContent = 'Please enter email and password';
            return;
        }
        
        msgDiv.className = 'message success';
        msgDiv.textContent = 'Connecting to server...';
        
        try {
            const response = await fetch(API_URL + '/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            const data = await response.json();
            console.log('Login response:', data);
            
            if (response.ok) {
                msgDiv.className = 'message success';
                msgDiv.textContent = 'Login successful! Redirecting...';
                
                // Store token and user info
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                // Redirect based on role
                setTimeout(() => {
                    redirectToDashboard(data.user.role);
                }, 1000);
                
            } else {
                msgDiv.className = 'message error';
                msgDiv.textContent = data.error || 'Login failed';
            }
        } catch (error) {
            console.error('Fetch error:', error);
            msgDiv.className = 'message error';
            msgDiv.textContent = 'Cannot connect to server. Is backend running?';
        }
    }

    async function handleRegister() {
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const phone = document.getElementById('regPhone').value.trim();
        const msgDiv = document.getElementById('registerMessage');
        
        msgDiv.className = 'message';
        
        if (!name || !email || !password) {
            msgDiv.className = 'message error';
            msgDiv.textContent = 'Name, email, and password are required';
            return;
        }
        
        msgDiv.className = 'message success';
        msgDiv.textContent = 'Registering...';
        
        try {
            const response = await fetch(API_URL + '/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    name, 
                    email, 
                    password, 
                    phone, 
                    role: 'member' 
                })
            });
            
            const data = await response.json();
            console.log('Register response:', data);
            
            if (response.ok) {
                msgDiv.className = 'message success';
                msgDiv.textContent = 'Registration successful! Redirecting to dashboard...';
                
                // Store token
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                // Redirect to member dashboard
                setTimeout(() => {
                    redirectToDashboard(data.user.role);
                }, 1500);
                
            } else {
                msgDiv.className = 'message error';
                msgDiv.textContent = data.error || 'Registration failed';
            }
        } catch (error) {
            console.error('Fetch error:', error);
            msgDiv.className = 'message error';
            msgDiv.textContent = 'Cannot connect to server';
        }
    }

   function redirectToDashboard(role) {
    console.log('Redirecting to dashboard for role:', role);
    
    // Since live-server serves from public folder, public is root "/"
    switch(role) {
        case 'admin':
            window.location.href = '/src/pages/admin/dashboard.html';
            break;
        case 'trainer':
            window.location.href = '/src/pages/trainer/dashboard.html';
            break;
        case 'member':
            window.location.href = '/src/pages/member/dashboard.html';
            break;
        case 'receptionist':
            window.location.href = '/src/pages/admin/dashboard.html';
            break;
        default:
            window.location.href = '/src/pages/admin/dashboard.html';
    }
}

    // Check if already logged in
    const savedToken = localStorage.getItem('token');
    const savedUser = JSON.parse(localStorage.getItem('user') || '{}');
    
    if (savedToken && savedUser.role) {
        console.log('Already logged in as:', savedUser.email);
        // Auto-redirect if already logged in
        setTimeout(() => {
            redirectToDashboard(savedUser.role);
        }, 500);
    }

    console.log('GymPro frontend loaded!');
</script>
</body>
</html>
